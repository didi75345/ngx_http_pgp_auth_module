# Example: protect a reverse-proxied app with PGP authentication
# instead of HTTP basic auth.

load_module modules/ngx_http_pgp_auth_module.so;   # dynamic build only

events {}

http {
    # ---------------------------------------------------------------------
    # Rate-limit login attempts. THIS IS NOT OPTIONAL.
    #
    # A login submission forks a gpg verification, which occupies a worker for
    # ~17-25 ms (see SECURITY.md for measurements). Everything else -- the
    # challenge page, an authenticated request, a body that isn't a clear-signed
    # message -- costs about 1 ms and never forks anything. Without a rate limit
    # on the login endpoint, an unauthenticated client can keep workers busy
    # forking gpg; with one, the exposure is bounded by simple arithmetic:
    #
    #     workers busy  ~=  rate x pgp_gpg_timeout  +  burst
    #
    # Keep that below `worker_processes` and there is always a free worker for
    # everything else nginx serves.
    #
    # THE GLOBAL LIMIT IS THE ONE THAT PROTECTS YOU. One bucket for the whole
    # login endpoint is the only thing that bounds how many verifications can be
    # in flight, and so the only thing that keeps workers free for everything
    # else this nginx serves.
    #
    # A per-IP limit is fairness, not defence -- an attacker's supply of source
    # addresses is cheap, and per-IP is useless or misleading in exactly the
    # deployments this module suits:
    #   * Tor onion service   -- every request arrives from the local Tor daemon,
    #                            so all users share one apparent address;
    #   * behind a CDN/proxy  -- $binary_remote_addr is the proxy's address
    #                            unless realip is configured.
    # Size your deployment on the global limit alone; keep the per-IP zone only
    # to stop one noisy client eating the global allowance.
    #
    # The key is empty (= not limited) unless the request is a challenge
    # submission (?__pgp_auth=1), so normal traffic is never rate-limited.
    # ---------------------------------------------------------------------
    map $arg___pgp_auth $pgp_login_all {
        default  "";
        "1"      "pgp_login";           # ONE bucket for the whole endpoint
    }
    map $arg___pgp_auth $pgp_login_ip {
        default  "";
        "1"      $binary_remote_addr;   # optional: per-client-IP fairness
    }
    limit_req_zone $pgp_login_all zone=pgp_login_all:1m  rate=2r/s;   # required
    limit_req_zone $pgp_login_ip  zone=pgp_login_ip:10m  rate=10r/m;  # optional

    server {
        listen 443 ssl;
        server_name app.example.com;

        ssl_certificate     /etc/ssl/app.crt;
        ssl_certificate_key /etc/ssl/app.key;

        location / {
            pgp_auth              on;
            pgp_keyring           /etc/nginx/pubkeys.gpg;   # who may log in
            pgp_session_secret    /etc/nginx/pgp_secret.key; # shared by all nodes
            pgp_gpg_path          /usr/bin/gpg;              # absolute path, no $PATH search
            pgp_challenge_timeout 120s;                     # challenge validity
            pgp_session_timeout   1h;                       # 0 = never re-challenge

            # --- security options (all shown at their defaults) ---
            pgp_session_cookie_secure on;      # Secure cookie (needs HTTPS)
            pgp_auth_bind_client_ip   on;      # bind token to client IP
            pgp_auth_bind_user_agent  on;      # bind token to User-Agent
            pgp_auth_nonce_storage    memory;  # single-use challenges (or redis/none)
            # pgp_auth_nonce_zone_size 8m;  # set once, at http{}/server{} level --
                                             # it's one shared zone for the whole config
            # pgp_auth_nonce_storage      redis;
            # pgp_auth_nonce_storage_address 127.0.0.1:6379;
            # pgp_auth_nonce_storage_password  changeme;   # if Redis requires AUTH
            pgp_revocation_list /etc/nginx/pgp_revoked.txt;  # revoked fingerprints

            # Both limits apply to login submissions only (see the zones above).
            # No `nodelay` on the global zone: excess logins are paced rather
            # than released all at once into concurrent gpg verifications.
            limit_req zone=pgp_login_all burst=4;   # REQUIRED: bounds concurrency
            limit_req zone=pgp_login_ip  burst=5;   # optional: per-IP fairness
            #
            # With rate=2r/s, burst=4 and pgp_gpg_timeout 2s the worst case is
            #   2 x 2s + 4 = 8 verifications in flight,
            # so give this at least `worker_processes 8;` -- or lower the
            # timeout (pgp_gpg_timeout 1s) and/or the rate for more headroom.
            # A real verification takes ~17-25 ms, so in practice occupancy is
            # a fraction of one worker; the figures above are the ceiling.

            proxy_pass http://127.0.0.1:8080;
        }
    }
}
